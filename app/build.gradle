plugins { id 'com.android.application' }

android {
    namespace 'it.andrea.jarvis'
    compileSdk 34
    defaultConfig {
        applicationId "it.andrea.jarvis"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "0.3"
    }
    signingConfigs {
        debug {
            def props = new Properties()
            def f = rootProject.file("signing.properties")
            if (f.exists()) {
                f.withInputStream { props.load(it) }
            }
            storeFile file(props.getProperty('STORE_FILE', 'jarvis.keystore'))
            storePassword System.getenv('JARVIS_STORE_PASSWORD') ?: props.getProperty('STORE_PASSWORD', '')
            keyAlias System.getenv('JARVIS_KEY_ALIAS') ?: props.getProperty('KEY_ALIAS', '')
            keyPassword System.getenv('JARVIS_KEY_PASSWORD') ?: props.getProperty('KEY_PASSWORD', '')
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
