name: Costruisci APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Chiave di firma stabile
        run: |
          if [ ! -f app/jarvis.keystore ]; then
            keytool -genkeypair -keystore app/jarvis.keystore -storepass jarvis123 -keypass jarvis123 -alias jarvis -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Jarvis"
            git config user.name "Jarvis"
            git config user.email "jarvis@users.noreply.github.com"
            git add app/jarvis.keystore
            git commit -m "Chiave di firma [skip ci]"
            git push
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: app/build/outputs/apk/debug/app-debug.apk
